- name: Run Build Script
  run: |
    set -euxo pipefail

    # Telegram Config
    TG_TOKEN="8647652050:AAG0ZKtMuE4NhlOKx8EHz4VHfgPLlguMTqw"
    TG_CHAT_ID="7540957411"

    # Function Telegram Message
    telegram_message() {
        curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
        -d chat_id="${TG_CHAT_ID}" \
        -d parse_mode="HTML" \
        -d text="$1"
    }

    # Function Telegram Upload
    telegram_upload() {
        curl -F chat_id="${TG_CHAT_ID}" \
             -F document=@"$1" \
             -F parse_mode=html \
             -F caption="$2" \
             "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"
    }

    # Prepare Timezone
    echo "⏰ Preparing timezone..."
    sudo rm -f /etc/localtime
    sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    # Install Dependencies
    echo "📦 Installing dependencies..."
    sudo apt update -y
    sudo apt install -y bc cpio flex bison aptitude git tar aria2 perl wget curl lz4 libssl-dev zip \
        python3 python-is-python3 || \
    sudo apt install -y bc cpio flex bison aptitude git tar aria2 perl wget curl lz4 libssl-dev zip python3

    # Clone Toolchains
    echo "🔧 Cloning toolchains..."
    mkdir -p clang
    cd clang
    curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
    chmod +x antman
    ./antman -S
    ./antman --patch=glibc || true
    cd ..

    git clone https://github.com/greenforce-project/gcc-arm64 -b main --depth=1 gcc64
    git clone https://github.com/greenforce-project/gcc-arm -b main --depth=1 gcc32

    # Setup Environment
    echo "⚙️ Setting up environment..."
    BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')
    BUILD_DATE="$(TZ=Asia/Jakarta date '+%b %d %Y')"
    CLANG_PATH=$(pwd)/clang
    GCC64_PATH=$(pwd)/gcc64
    GCC32_PATH=$(pwd)/gcc32
    BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)

    export BUILD_TIME BUILD_DATE CLANG_PATH GCC64_PATH GCC32_PATH

    # Telegram Start
    telegram_message "<b>🚀 Kernel Build Started</b>

<b>Branch:</b> <code>${BRANCH_NAME}</code>
<b>Date:</b> <code>${BUILD_DATE}</code>"

    # Build Kernel
    echo "🛠️ Build Kernel"
    export ARCH=arm64
    export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
    export KBUILD_BUILD_USER=EsTeh
    export KBUILD_BUILD_HOST=Teh-Pesona
    export KBUILD_COMPILER_STRING="$($CLANG_PATH/bin/clang --version | head -n1)"
    export CFLAGS_EXTRA="-DBUILD_DATE=$BUILD_DATE"

    make O=out ARCH=arm64 courbet_defconfig

    make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
        CLANG_TRIPLE=aarch64-linux-gnu- \
        CROSS_COMPILE=aarch64-elf- \
        CROSS_COMPILE_ARM32=arm-eabi- 2>&1 | tee build.log

    # Check Build Result — cek file Image.gz, bukan grep error di log
    if [ -f out/arch/arm64/boot/Image.gz ]; then
        echo "✅ Build success"

        # Save Build Config
        echo "💾 Saving config..."
        mv out/.config out/courbet_defconfig.txt

        # Prepare AnyKernel3
        echo "📂 Preparing AnyKernel3..."
        git clone --depth=1 https://github.com/ZGSYet/AnyKernel3.git -b master AnyKernel3

        cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz

        # dtbo & dtb tidak selalu ada, skip kalau tidak ada
        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
        [ -f out/arch/arm64/boot/dtb.img ]  && cp out/arch/arm64/boot/dtb.img  AnyKernel3/dtb.img

        # Create Flashable ZIP
        echo "📦 Creating flashable zip..."
        cd AnyKernel3
        zip -r9 "../NekoPoi-${BUILD_TIME}.zip" . -x '*.git*'
        cd ..

        # Upload ZIP
        telegram_upload "NekoPoi-${BUILD_TIME}.zip" "<b>✅ Build Success</b>

<b>Kernel:</b> NekoPoi
<b>Branch:</b> <code>${BRANCH_NAME}</code>
<b>Date:</b> <code>${BUILD_DATE}</code>"

    else
        echo "❌ Build failed"

        telegram_message "❌ <b>Build Failed</b>

<b>Branch:</b> <code>${BRANCH_NAME}</code>"

        telegram_upload "build.log" "❌ Build Log"
        exit 1
    fi
