name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository kernel"
        required: true
        default: "https://github.com/ZGSYet/NekoPoi-Kranul.git"
      branch:
        description: "Branch yang ingin dibuild"
        required: true
        default: "test"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install LLVM & Clang
        run: |
          sudo apt update -y
          sudo apt install -y software-properties-common wget

          # Install LLVM 18 via official script
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18 all

          # Buat symlink supaya bisa dipanggil tanpa suffix -18
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objdump \
                      llvm-objcopy llvm-strip llvm-readelf llvm-ranlib; do
            sudo ln -sf /usr/bin/${tool}-18 /usr/local/bin/${tool} 2>/dev/null || true
          done

      - name: Install Build Dependencies
        run: |
          sudo apt install -y \
            bc cpio flex bison git tar aria2 perl wget curl \
            lz4 libssl-dev zip python3 python-is-python3 \
            make binutils libelf-dev

      - name: Check LLVM
        run: |
          clang --version
          llvm-objdump --version
          llvm-nm --version
          llvm-ar --version

      - name: Clone Selected Repo
        run: |
          git clone --depth=1 \
            --branch "${{ github.event.inputs.branch }}" \
            "${{ github.event.inputs.repo }}" \
            source

      - name: Build Kernel
        run: |
          cd source
          chmod +x build.sh
          ./build.sh
